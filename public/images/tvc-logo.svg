<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 140" width="100%" height="100%">
  <defs>
    <!-- Gradien kotak biru kiri -->
    <linearGradient id="blueBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ab4f8" />
      <stop offset="50%" stop-color="#5c8cd6" />
      <stop offset="100%" stop-color="#2a5298" />
    </linearGradient>
    
    <!-- Gradien kotak hitam kanan -->
    <linearGradient id="blackBoxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#333333" />
      <stop offset="50%" stop-color="#111111" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
  </defs>

  <!-- Background Hitam -->
  <rect width="470" height="140" fill="#000000" rx="8" />

  <!-- Kotak Biru & Huruf T -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="145" height="120" fill="url(#blueBoxGrad)" />
    <!-- Huruf T dengan gaya serif -->
    <text x="72.5" y="96" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="92" font-weight="bold" fill="#ffffff" text-anchor="middle">T</text>
  </g>

  <!-- Kotak Merah & Huruf V (dengan ornamen lengkung) -->
  <g transform="translate(160, 10)">
    <rect x="0" y="0" width="145" height="120" fill="#ff0000" />
    <!-- Huruf V -->
    <text x="72.5" y="98" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="88" font-weight="bold" font-style="italic" fill="#000000" text-anchor="middle">V</text>
    <!-- Detail lengkungan pada V -->
    <path d="M 90 44 C 102 32, 114 46, 106 58 C 98 70, 84 62, 94 48" fill="none" stroke="#000000" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- Kotak Hitam & Huruf C -->
  <g transform="translate(310, 10)">
    <rect x="0" y="0" width="145" height="120" fill="url(#blackBoxGrad)" />
    <!-- Huruf C dengan gaya serif -->
    <text x="72.5" y="96" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="92" font-weight="bold" fill="#ffffff" text-anchor="middle">C</text>
  </g>
</svg>